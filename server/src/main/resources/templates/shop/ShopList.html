<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dishcovery | 상점</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/mainPage.css}" />
    <link rel="stylesheet" href="/css/shop.css" />
</head>
<body>

<div th:insert="fragments/header :: site-header"></div>

<main class="page">
    <section class="controls container">
        <div class="segmented" role="tablist" aria-label="콘텐츠 종류">
            <button type="button" th:class="${rcpClassNm}"
                    onclick="handleSegmentClick(this, '/pageGubun?gubun=recipe')"
                    role="tab" aria-selected="true">레시피</button>

            <button type="button" th:class="${rankClassNm}"
                    onclick="handleSegmentClick(this, '/pageGubun?gubun=rank')"
                    role="tab" aria-selected="false">상점</button>
        </div>
    </section>

    <section class="content container">

        <h2 class="result-title" th:if="${searchName != null and !#strings.isEmpty(searchName)}">
            '<span th:text="${searchName}"></span>' 검색결과
        </h2>

        <!-- ✅ 절대 안 터지는 디버그/상태 표시 -->
        <div class="shop-count"
             th:text="'상품 수: ' + ${products == null ? 0 : #lists.size(products)}"></div>

        <!-- 서버에서 에러 메시지 내려주면 표시 -->
        <div th:if="${errorMessage != null}"
             class="shop-error"
             th:text="${errorMessage}">
            에러 메시지
        </div>

        <div class="product-grid" id="productListContainer">

            <!-- products가 null이거나 비었으면 안내문 -->
            <div th:if="${products == null or #lists.isEmpty(products)}"
                 class="shop-empty">
                현재 표시할 상품이 없습니다.
            </div>

            <!-- products가 있을 때만 렌더 -->
            <a class="product-card" th:if="${products != null}" th:each="p : ${products}"
               th:href="@{|/shop/product/${p.productId}|}">
                <img th:if="${p.mainImage != null}" th:src="${p.mainImage}" alt="상품 이미지" onerror="this.style.display='none'">
                <div class="product-thumb-empty" th:unless="${p.mainImage != null}"></div>
                <div class="product-info">
                    <div class="product-name" th:text="${p.productName}">상품명</div>
                </div>
            </a>

        </div>
    </section>
</main>

<script th:src="@{/js/mainPage.js}"></script>
</body>
</html>
