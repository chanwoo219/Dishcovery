<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title th:text="'Dishcovery | ' + ${product.productName}">Dishcovery | 상품</title>
    <link rel="stylesheet" th:href="@{/css/mainPage.css}" />
    <link rel="stylesheet" href="/css/shop.css" />
</head>
<body>

<div th:insert="fragments/header :: site-header"></div>

<main class="wrap">

    <div class="my-point-bar">
        내 포인트 <b th:text="${myPoint}">0</b>P
    </div>

    <section class="pd">
        <!-- 좌측: 이미지 -->
        <div class="pd-left">
            <div class="img-box">
                <img th:src="${product.mainImage != null ? product.mainImage : '/img/no-image.png'}"
                     alt="상품 이미지" />
            </div>
            <div class="mini-badges">
                <span class="badge">빠른구매</span>
                <span class="badge">포인트결제</span>
            </div>
        </div>

        <!-- 우측: 정보 -->
        <div class="pd-right">
            <div class="pd-brand">Dishcovery</div>
            <h1 class="name" th:text="${product.productName}">상품명</h1>

            <div class="price-box">
                <div class="price">
                    <span class="label">포인트</span>
                    <span class="value" th:text="${product.productPoint}">0</span><span class="unit">P</span>
                </div>
            </div>

            <div class="meta">
                <div class="meta-row">
                    <span class="k">배송</span><span class="v">디지털 상품(즉시 지급)</span>
                </div>
                <div class="meta-row">
                    <span class="k">혜택</span><span class="v">조회 포인트로 구매 가능</span>
                </div>
            </div>

            <form class="buy" method="post" action="/shop/purchase" onsubmit="return confirm('정말로 구매하시겠습니까?')">
                <input type="hidden" name="productId" th:value="${product.productId}" />

                <div class="qty">
                    <span class="k">수량</span>
                    <input type="number" id="qtyInput" name="qty" min="1" value="1"
                           th:attr="data-unit-point=${product.productPoint},data-my-point=${myPoint}"
                           oninput="updateBuyButton()" />
                </div>

                <div class="cta">
                    <button type="submit" id="buyBtn" class="btn-buy">구매하기</button>
                </div>

                <div class="hint" th:if="${param.purchased}">
                    ✅ 구매가 완료되었습니다.
                </div>
                <div class="err" th:if="${param.error}" th:text="'⚠️ ' + ${param.error}">
                    ⚠️ 오류
                </div>
            </form>

            <div class="safe">
                <span>안전결제</span> · <span>고객센터</span> · <span>환불정책</span>
            </div>
        </div>
    </section>

    <section class="tabs">
        <button type="button" class="tab active" data-target="detail">상세정보</button>
        <button type="button" class="tab" data-target="review">리뷰 (<span th:text="${#lists.size(reviews)}">0</span>)</button>
        <button type="button" class="tab" data-target="qna">문의 (<span th:text="${#lists.size(inquiries)}">0</span>)</button>
    </section>

    <section id="detail" class="panel">
        <h2>상세정보</h2>
        <p class="desc">상품 설명이 없습니다.</p>
    </section>

    <section id="review" class="panel hidden">
        <h2>리뷰</h2>

        <p class="avg-rating" th:if="${!#lists.isEmpty(reviews)}">
            평균 별점 <b th:text="${#numbers.formatDecimal(avgRating, 1, 1)}">0.0</b> / 5 (<span th:text="${#lists.size(reviews)}">0</span>개)
        </p>

        <form th:if="${hasPurchased}" th:action="@{|/shop/product/${product.productId}/review|}" method="post" class="review-form">
            <select name="rating" required>
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★ (4)</option>
                <option value="3">★★★ (3)</option>
                <option value="2">★★ (2)</option>
                <option value="1">★ (1)</option>
            </select>
            <textarea name="content" rows="2" placeholder="상품에 대한 리뷰를 남겨주세요" required></textarea>
            <button type="submit">리뷰 등록</button>
        </form>
        <p class="muted" th:unless="${hasPurchased}">구매한 상품만 리뷰를 작성할 수 있어요.</p>

        <p class="muted" th:if="${#lists.isEmpty(reviews)}">아직 등록된 리뷰가 없어요.</p>
        <ul class="review-list">
            <li th:each="r : ${reviews}">
                <div class="review-meta">
                    <span th:text="${'★'.repeat(r.rating)}"></span>
                    <span th:text="${r.userId}"></span>
                </div>
                <p th:text="${r.content}"></p>
            </li>
        </ul>
    </section>

    <section id="qna" class="panel hidden">
        <h2>문의</h2>

        <form th:action="@{|/shop/product/${product.productId}/inquiry|}" method="post" class="review-form">
            <textarea name="content" rows="2" placeholder="궁금한 점을 문의해주세요" required></textarea>
            <button type="submit">문의 등록</button>
        </form>

        <p class="muted" th:if="${#lists.isEmpty(inquiries)}">아직 등록된 문의가 없어요.</p>
        <ul class="review-list">
            <li th:each="q : ${inquiries}">
                <div class="review-meta">
                    <span th:text="${q.userId}"></span>
                </div>
                <p th:text="${q.content}"></p>
            </li>
        </ul>
    </section>

    <!-- 추천 상품(선택) -->
    <section class="reco" th:if="${recommended != null}">
        <h3>추천 상품</h3>
        <div class="reco-grid">
            <a class="reco-card" th:each="r : ${recommended}" th:href="@{|/shop/product/${r.productId}|}">
                <div class="reco-img">
                    <img th:src="${r.mainImage != null ? r.mainImage : '/img/no-image.png'}" alt="추천" />
                </div>
                <div class="reco-name" th:text="${r.productName}">상품명</div>
                <div class="reco-price"><b th:text="${r.productPoint}">0</b>P</div>
            </a>
        </div>
    </section>

</main>

<script>
    function updateBuyButton() {
        const qtyInput = document.getElementById('qtyInput');
        const buyBtn = document.getElementById('buyBtn');
        if (!qtyInput || !buyBtn) return;

        const unitPoint = Number(qtyInput.dataset.unitPoint) || 0;
        const myPoint = Number(qtyInput.dataset.myPoint) || 0;
        const qty = Number(qtyInput.value) || 0;

        buyBtn.classList.toggle('enough', myPoint >= unitPoint * qty);
    }
    updateBuyButton();

    document.querySelectorAll('.tabs .tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
            document.querySelectorAll('.tabs .tab').forEach(function (t) { t.classList.remove('active'); });
            document.querySelectorAll('.panel').forEach(function (p) { p.classList.add('hidden'); });
            tab.classList.add('active');
            document.getElementById(tab.dataset.target).classList.remove('hidden');
        });
    });
</script>
</body>
</html>
