<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dishcovery | 상점</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/mainPage.css}" />
    <link rel="stylesheet" href="/css/shop.css" />
</head>
<body>
<form id="shopForm" name="shopForm" method="get">
<!--    <div th:replace="fragments/header :: site-header('shop')"></div>-->
    <div th:replace="fragments/header :: site-header"></div>

    <main class="page">
        <section class="controls container">
            <div class="segmented" role="tablist" aria-label="콘텐츠 종류">
                <button type="button" class="seg-btn"
                        onclick="location.href='/recipe'"
                        role="tab" aria-selected="false">레시피</button>

                <button type="button" class="seg-btn active"
                        onclick="location.href='/shop'"
                        role="tab" aria-selected="true">상점</button>
            </div>

        </section>

        <section class="content container">
            <div class="recipe-grid" id="productListContainer">
                <article class="recipe-card" th:each="p : ${products}">
                    <div class="product-image">
                        <img th:if="${p.mainImage != null and !#strings.isEmpty(p.mainImage)}"
                             th:src="${p.mainImage}" alt="상품 이미지" />
                    </div>

                    <div class="product-info">
                        <div class="product-name" th:text="${p.productName}">상품 1</div>
                        <div class="product-price"><span th:text="${p.productPoint}">10000</span>P</div>
                    </div>

                    <form th:action="@{/shop/buy}" method="post" class="buy-form"
                          onsubmit="return confirm('상품을 구매하시겠습니까?');">
                        <input type="hidden" name="productId" th:value="${p.productId}">
                        <button type="submit" class="buy-btn">구매</button>
                    </form>
                </article>
            </div>
        </section>
    </main>
</form>
<script th:src="@{/js/mainPage.js}"></script>
</body>
</html>
