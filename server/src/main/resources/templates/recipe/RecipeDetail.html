<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dishcovery | 레시피 상세</title>
  <link rel="stylesheet" th:href="@{/css/register.css}">
  <link rel="stylesheet" th:href="@{/css/mainPage.css}" />
</head>
<body>
<header class="topbar">
  <div th:insert="fragments/header :: site-header"></div>

</header>

<main class="page">

  <section class="form-section container">
    <div class="detail-wrap">
    <form class="recipe-form" th:object="${recipe}" method="post" enctype="multipart/form-data">

      <div class="form-card">
        <h2>기본 정보</h2>
        <div class="form-grid">
          <div class="form-row">
            <label for="title">레시피 이름</label>
            <input type="text" id="title" name="title" th:value="${recipe.title}" readonly="readonly">
          </div>
          <div class="form-row">
              <label for="categoryId">카테고리</label>
              <select id="categoryId" name="categoryId" disabled>
                  <option value="">선택</option>
                  <option th:each="cat : ${categoryList}" th:value="${cat.code}" th:text="${cat.codeName}" th:selected="${cat.code == recipe.categoryId}"></option>
              </select>
          </div>
          <div class="form-row">
            <label for="cookTime">조리 시간</label>
            <input type="text" id="cookTime" name="cookTime" th:value="${recipe.cookTime}" readonly="readonly">
          </div>
          <div class="form-row">
            <label for="cookDfct">난이도</label>
            <input type="text" id="cookDfct" name="cookDfct" th:value="${recipe.cookDfct}" readonly="readonly">
          </div>
        </div>
      </div>

        <div class="form-card">
            <div class="form-row">
                <h2>대표 이미지</h2>
                <div id="mainPreviewArea" class="single-preview-area">
                    <span>
                         <img th:src="${recipe.imgUrl}" alt="레시피 이미지" class="single-preview-image">
                    </span>
                </div>
            </div>
        </div>
      <div class="form-card">
        <h2>요리 소개와 준비물</h2>
        <div class="form-row">
          <label for="rcpDisc">요리 소개</label>
          <textarea id="rcpDisc" name="rcpDisc" rows="3" th:text="${recipe.rcpDisc}"    readonly> </textarea>
        </div>
        <div class="form-row">
          <label for="recipeIngr">필수 재료</label>
          <textarea id="recipeIngr" name="recipeIngr" rows="3" th:text="${recipe.recipeIngr}"   readonly></textarea>
        </div>
      </div>

      <div class="form-card">
        <div class="label-with-action">
            <h2>조리 단계</h2>
        </div>
        <div class="step-list" data-step-list>
            <div class="step-row" data-step  th:each="step : ${stepList}">
                <span class="step-index" th:text="${step.stepOrder}">1</span>
                <textarea rows="2" th:text="${step.stepDescription}" readonly></textarea>
            </div>
        </div>
      </div>
      <div class="form-card">
        <h2>마무리</h2>
        <div class="form-row">
            <label for="recipeTip">팁 &amp; 노하우</label>
            <textarea id="recipeTip" name="recipeTip" rows="2"  th:text="${recipe.recipeTip}"   readonly></textarea>
        </div>
        <div class="form-row">
            <label for="recipeTag">해시태그</label>
            <input type="text" id="recipeTag" name="recipeTag" th:value="${recipe.recipeTag}"   readonly>
        </div>
      </div>

    </form>

      <div class="form-card like-card">
          <form method="post" th:action="@{/recipe/like}">
              <input type="hidden" name="recipeId" th:value="${recipe.recipeId}">
              <button type="submit" th:class="${liked} ? 'like-btn liked' : 'like-btn'">
                  <span th:text="${liked} ? '♥' : '♡'"></span>
                  좋아요 <span th:text="${likeCount}">0</span>
              </button>
          </form>
      </div>

      <div class="form-card comment-card">
          <h2>댓글 <span th:text="${#lists.size(comments)}">0</span></h2>

          <p class="error-msg" th:if="${param.error}" th:text="${param.error}"></p>

          <form method="post" th:action="@{/recipe/comment}" class="comment-form">
              <input type="hidden" name="recipeId" th:value="${recipe.recipeId}">
              <textarea name="content" rows="2" placeholder="댓글을 남겨보세요" required></textarea>
              <button type="submit">댓글 등록</button>
          </form>

          <p class="muted" th:if="${#lists.isEmpty(comments)}">아직 등록된 댓글이 없어요.</p>
          <ul class="comment-list">
              <li th:each="c : ${comments}">
                  <div class="comment-meta" th:text="${c.userName}"></div>
                  <p th:text="${c.content}"></p>
              </li>
          </ul>
      </div>

    </div>
  </section>
</main>

    <div class="toast" role="status" aria-live="polite" hidden>레시피 등록 요청이 전송되었습니다.</div>

    <script th:src="@{/js/register.js}"></script>
    <script>


    </script>
    </body>
</html>
