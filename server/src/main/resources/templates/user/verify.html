<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인증 | Dishcovery</title>
    <link rel="stylesheet" th:href="@{/css/mainPage.css}">
</head>
<body>

<div th:insert="fragments/header :: site-header"></div>

<main class="page">
    <section class="content container" style="max-width:720px;">
        <h2 style="margin: 6px 0 16px;">이메일 인증</h2>

        <div th:if="${msg != null}"
             style="margin-bottom: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,0.05);"
             th:text="${msg}"></div>

        <!-- 1) 코드 전송 -->
        <form th:action="@{/user/send-code}" method="post"
              style="padding: 14px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08); margin-bottom: 14px;">
            <div style="font-weight: 700; margin-bottom: 10px;">인증 코드 보내기</div>

            <label style="display:block; font-size: 13px; opacity:.7; margin-bottom: 6px;">인증받을 이메일</label>
            <input name="targetEmail" type="email" required
                   th:value="${targetEmail != null ? targetEmail : ''}"
                   style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); margin-bottom: 10px;">

            <button type="submit" class="sort" style="padding: 10px 14px; border-radius: 12px;">인증 코드 보내기</button>
        </form>

        <!-- 2) 코드 검증 -->
        <form th:action="@{/user/verify-code}" method="post"
              style="padding: 14px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08); margin-bottom: 14px;">
            <div style="font-weight: 700; margin-bottom: 10px;">인증 코드 확인</div>

            <label style="display:block; font-size: 13px; opacity:.7; margin-bottom: 6px;">이메일</label>
            <input name="targetEmail" type="email" required
                   th:value="${targetEmail != null ? targetEmail : ''}"
                   style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); margin-bottom: 10px;">

            <label style="display:block; font-size: 13px; opacity:.7; margin-bottom: 6px;">인증 코드</label>
            <input name="code" type="text" required maxlength="6" placeholder="6자리 코드"
                   style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); margin-bottom: 10px;">

            <button type="submit" class="sort" style="padding: 10px 14px; border-radius: 12px;">인증 완료</button>
        </form>

        <!-- 3) 인증 완료 후만 이동 -->
        <div style="padding: 14px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08);">
            <div style="font-weight: 700; margin-bottom: 10px;">변경 페이지로 이동</div>

            <button class="sort" style="padding: 10px 14px; border-radius: 12px;"
                    th:disabled="${verified == null or !verified}"
                    th:onclick="|location.href='@{/user/email}'|">
                이메일 변경
            </button>

            <button class="sort" style="padding: 10px 14px; border-radius: 12px; margin-left: 10px;"
                    th:disabled="${verified == null or !verified}"
                    th:onclick="|location.href='@{/user/password}'|">
                비밀번호 변경
            </button>
        </div>
    </section>
</main>

</body>
</html>
