<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인증 | Dishcovery</title>
    <link rel="stylesheet" th:href="@{/css/mainPage.css}">
</head>
<body>

<div th:insert="fragments/header :: site-header"></div>

<main class="page">
    <section class="content container narrow-content">
        <h2 class="page-title">이메일 인증</h2>

        <div th:if="${msg != null}" class="msg-box" th:text="${msg}"></div>

        <!-- 1) 코드 전송 -->
        <form th:action="@{/user/send-code}" method="post" class="form-card">
            <div class="form-card-title">인증 코드 보내기</div>

            <label class="field-label">인증받을 이메일</label>
            <input name="targetEmail" type="email" required
                   th:value="${targetEmail != null ? targetEmail : ''}"
                   class="field-input">

            <button type="submit" class="btn-action">인증 코드 보내기</button>
        </form>

        <!-- 2) 코드 검증 -->
        <form th:action="@{/user/verify-code}" method="post" class="form-card">
            <div class="form-card-title">인증 코드 확인</div>

            <label class="field-label">이메일</label>
            <input name="targetEmail" type="email" required
                   th:value="${targetEmail != null ? targetEmail : ''}"
                   class="field-input">

            <label class="field-label">인증 코드</label>
            <input name="code" type="text" required maxlength="6" placeholder="6자리 코드"
                   class="field-input">

            <button type="submit" class="btn-action">인증 완료</button>
        </form>

        <!-- 3) 인증 완료 후만 이동 -->
        <div class="form-card">
            <div class="form-card-title">변경 페이지로 이동</div>

            <button class="btn-action"
                    th:disabled="${verified == null or !verified}"
                    th:onclick="|location.href='@{/user/email}'|">
                이메일 변경
            </button>

            <button class="btn-action"
                    th:disabled="${verified == null or !verified}"
                    th:onclick="|location.href='@{/user/password}'|">
                비밀번호 변경
            </button>
        </div>
    </section>
</main>

</body>
</html>
