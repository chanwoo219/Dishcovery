<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이메일 변경 | Dishcovery</title>
    <link rel="stylesheet" th:href="@{/css/mainPage.css}">
</head>
<body>

<div th:insert="fragments/header :: site-header"></div>

<main class="page">
    <section class="content container narrow-content">
        <h2 class="page-title">이메일 변경</h2>

        <div th:if="${msg != null}" class="msg-box" th:text="${msg}"></div>

        <form th:action="@{/user/email}" method="post" class="form-card">
            <label class="field-label">새 이메일</label>
            <input name="newEmail" type="email" required placeholder="변경할 이메일"
                   class="field-input">

            <button type="submit" class="btn-action">저장</button>
            <button type="button" class="btn-action" onclick="location.href='/myPage'">취소</button>
        </form>
    </section>
</main>

</body>
</html>
