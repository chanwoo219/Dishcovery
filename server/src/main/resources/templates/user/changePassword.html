<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비밀번호 변경 | Dishcovery</title>
    <link rel="stylesheet" th:href="@{/css/mainPage.css}">
</head>
<body>

<div th:insert="fragments/header :: site-header"></div>

<main class="page">
    <section class="content container" style="max-width:720px;">
        <h2 style="margin: 6px 0 16px;">비밀번호 변경</h2>

        <div th:if="${msg != null}"
             style="margin-bottom: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,0.05);"
             th:text="${msg}"></div>

        <form th:action="@{/user/password}" method="post"
              style="padding: 14px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08);">
            <label style="display:block; font-size: 13px; opacity:.7; margin-bottom: 6px;">새 비밀번호</label>
            <input name="newPassword" type="password" required placeholder="새 비밀번호"
                   style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); margin-bottom: 10px;">

            <label style="display:block; font-size: 13px; opacity:.7; margin-bottom: 6px;">새 비밀번호 확인</label>
            <input name="newPasswordConfirm" type="password" required placeholder="새 비밀번호 확인"
                   style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); margin-bottom: 12px;">

            <button type="submit" class="sort" style="padding: 10px 14px; border-radius: 12px;">저장</button>
            <button type="button" class="sort" style="padding: 10px 14px; border-radius: 12px; margin-left: 10px;"
                    onclick="location.href='/myPage'">취소</button>
        </form>
    </section>
</main>

</body>
</html>
