<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dishcovery | 비밀번호 변경</title>
    <link rel="stylesheet" href="/css/login.css" />
</head>
<body>

<main class="page">
    <a class="brand" href="/MainPage">Dishcovery</a>
    <p class="subtitle">비밀번호 재설정</p>

    <section class="auth-card" aria-label="비밀번호 변경">
        <form method="post" action="/reset_password/verify" class="stacked-form">
            <input type="email" name="userMail" class="input" placeholder="이메일" required />
            <input name="code" class="input" placeholder="6자리 인증코드" inputmode="numeric" maxlength="6" required />
            <input type="password" name="newPassword" class="input" placeholder="새 비밀번호" minlength="8" required />
            <input type="password" name="confirmPassword" class="input" placeholder="비밀번호 확인" minlength="8" required />
            <button type="submit" class="btn primary">비밀번호 변경</button>
        </form>

        <p th:if="${msg}" th:text="${msg}" class="error-msg"></p>

        <div class="helper-row">
            <a th:href="@{/reset_password}">인증코드 다시 받기</a>
            <a th:href="@{/dishcovery_login(gubun='login')}">로그인으로</a>
        </div>
    </section>
</main>

</body>
</html>
