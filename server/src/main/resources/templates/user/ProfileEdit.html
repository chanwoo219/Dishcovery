<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 수정 | Dishcovery</title>
    <link rel="stylesheet" th:href="@{/css/mainPage.css}">
</head>
<body>

<div th:insert="fragments/header :: site-header"></div>

<main class="page">
    <section class="content container" style="max-width:720px;">
        <h2 style="margin: 6px 0 16px;">프로필 수정</h2>

        <div th:if="${msg != null}" style="margin-bottom: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,0.05);"
             th:text="${msg}"></div>

        <div style="display:flex; gap: 12px; flex-wrap:wrap; margin-bottom: 16px;">
            <div style="flex:1; min-width: 220px; padding: 12px; border-radius: 14px; background: rgba(0,0,0,0.03);">
                <div style="font-size: 13px; opacity: .7;">아이디</div>
                <div style="font-size: 18px; font-weight: 700;" th:text="${user.userId}"></div>
            </div>
            <div style="flex:1; min-width: 220px; padding: 12px; border-radius: 14px; background: rgba(0,0,0,0.03);">
                <div style="font-size: 13px; opacity: .7;">포인트</div>
                <div style="font-size: 18px; font-weight: 700;">
                    <span th:text="${user.pointBalance}"></span> P
                </div>
            </div>
        </div>

        <!-- 1) 이메일 인증 코드 전송 -->
        <form th:action="@{/profile/send-code}" method="post" style="padding: 14px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08); margin-bottom: 14px;">
            <div style="font-weight: 700; margin-bottom: 10px;">이메일 변경/비밀번호 변경을 위한 인증</div>
            <div style="font-size: 13px; opacity:.7; margin-bottom: 10px;">변경하려는 이메일(또는 현재 이메일)로 인증 코드를 받아주세요.</div>

            <label style="display:block; font-size: 13px; opacity:.7; margin-bottom: 6px;">인증받을 이메일</label>
            <input name="targetEmail" type="email" required
                   th:value="${targetEmail != null ? targetEmail : user.userMail}"
                   style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); margin-bottom: 10px;">

            <button type="submit" class="sort" style="padding: 10px 14px; border-radius: 12px;">인증 코드 보내기</button>
        </form>

        <!-- 2) 코드 검증 -->
        <form th:action="@{/profile/verify-code}" method="post" style="padding: 14px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08); margin-bottom: 14px;">
            <div style="font-weight: 700; margin-bottom: 10px;">인증 코드 확인</div>

            <input type="hidden" name="targetEmail" th:value="${targetEmail != null ? targetEmail : user.userMail}">

            <label style="display:block; font-size: 13px; opacity:.7; margin-bottom: 6px;">인증 코드</label>
            <input name="code" type="text" required maxlength="6" placeholder="6자리 코드"
                   style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); margin-bottom: 10px;">

            <button type="submit" class="sort" style="padding: 10px 14px; border-radius: 12px;">인증 완료</button>
        </form>

        <!-- 3) 실제 변경 저장 -->
        <form th:action="@{/profile/update}" method="post" style="padding: 14px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.08);">
            <div style="font-weight: 700; margin-bottom: 10px;">변경 저장</div>

            <label style="display:block; font-size: 13px; opacity:.7; margin-bottom: 6px;">새 이메일 (선택)</label>
            <input name="newEmail" type="email" placeholder="변경할 이메일"
                   th:value="${targetEmail != null ? targetEmail : ''}"
                   style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); margin-bottom: 10px;">

            <label style="display:block; font-size: 13px; opacity:.7; margin-bottom: 6px;">새 비밀번호 (선택)</label>
            <input name="newPassword" type="password" placeholder="새 비밀번호"
                   style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.15); margin-bottom: 12px;">

            <button type="submit"
                    class="sort"
                    style="padding: 10px 14px; border-radius: 12px;">
                저장
            </button>

            <button type="button"
                    class="sort"
                    style="padding: 10px 14px; border-radius: 12px; margin-left: 10px;"
                    onclick="location.href='/myPage'">
                취소
            </button>
        </form>
    </section>
</main>

</body>
</html>
