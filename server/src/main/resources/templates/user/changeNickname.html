<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>닉네임 변경 | Dishcovery</title>
    <link rel="stylesheet" th:href="@{/css/mainPage.css}">
</head>
<body>

<div th:insert="fragments/header :: site-header"></div>

<main class="page">
    <section class="content container narrow-content">
        <h2 class="page-title">닉네임 변경</h2>

        <div th:if="${msg != null}" class="msg-box" th:text="${msg}"></div>

        <form th:action="@{/user/nickname}" method="post" class="form-card"
              onsubmit="return checkNicknameLength();">
            <label class="field-label">닉네임 (최대 6자)</label>
            <input name="userName" id="userName" type="text" required maxlength="6" th:value="${currentName}" placeholder="닉네임"
                   class="field-input">

            <button type="submit" class="btn-action">저장</button>
            <button type="button" class="btn-action" onclick="location.href='/myPage'">취소</button>
        </form>
    </section>
</main>

<script>
    function checkNicknameLength() {
        const value = document.getElementById('userName').value;
        if (value.length > 6) {
            alert('닉네임은 최대 6자까지 입력할 수 있습니다.');
            return false;
        }
        return true;
    }
</script>

</body>
</html>
